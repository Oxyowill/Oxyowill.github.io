    <h1>Hyacinth Macaw</h1>
    <h2>Brilliant blue parrot</h2>

    <p>
      The hyacinth macaw is a very large parrot with a strong bill.
      It cracks hard nuts and calls loudly in the trees.
    </p>

    <figure>
      <img src="images/blue.jpg" alt="Hyacinth macaw perched on a branch under green leaves" class="small"/>
      <figcaption>Deep blue feathers with a yellow ring around the eye.</figcaption>
    </figure>

    <p>
      It lives in parts of Brazil Bolivia and Paraguay.
    </p>
