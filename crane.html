    <h1>Sandhill Crane</h1>
    <h2>Tall bird of open fields and marsh</h2>

    <p>
      Sandhill cranes walk with slow steps and probe the ground for food.
      Adults have a red crown patch and a long pointed bill.
    </p>

    <figure>
      <img src="images/gray.jpg" alt="Sandhill crane foraging in bright green grass" class="small"/>
      <figcaption>Long legs and gray feathers with red crown.</figcaption>
    </figure>

    <p>
      In spring they make loud calls that carry across the fields.
    </p>
